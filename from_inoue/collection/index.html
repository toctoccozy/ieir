    /* PC版：スライド間のスペース */
    @media (min-width: 768px) {
        .slider-main .slick-slide {
            margin: 0 10px;
        }

        .slider-main .slick-list {
            margin: 0 -10px;
        }

        /* センターモードの前後のスライドを半透明に */
        .slider-main .slick-slide:not(.slick-center) {
            opacity: 0.6;
            transform: scale(0.95);
            transition: all 0.3s ease;
        }

        .slider-main .slick-slide.slick-center {
            opacity: 1;
            transform: scale(1);
        }
    }

    /* モバイルではスライドを画面幅いっぱいに */
    @media (max-width: 767px) {
        .slider-main .slick-slide {
            margin: 0;
            opacity: 1 !important;
            transform: scale(1) !important;
        }

        .slider-main .slick-list {
            margin: 0;
        }
    }

    /* ドットのスタイル調整 */
    .slick-dots {
        position: relative;
        bottom: auto;
        margin-top: 0px;
        margin-bottom: 0;
    }

    .slick-dots li button:before {
        font-size: 8px;
        color: rgba(100, 100, 100, 0.8);
    }

    .slick-dots li.slick-active button:before {
        color: #333;
    }
    @media (max-width: 767px) {
        .slick-dots li {
            margin: 0 1px; /* デフォルトは5px、2pxに縮める */
        }
    }


    /* PC版ではドットを非表示 */
    @media (min-width: 1024px) {
        .slick-dots {
            display: none !important;
        }
    }

    /* デフォルトの矢印アイコンを非表示 */
    .slick-prev:before,
    .slick-next:before {
        display: none !important;
        content: '' !important;
    }

    /* スマホ版では矢印を非表示 */
    @media (max-width: 767px) {
